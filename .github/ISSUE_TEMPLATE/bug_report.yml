name: Bug 报告
description: 报告抓取、显示、导出或新版创作者中心兼容问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交账号、作品标题、Cookie、Token 或其他隐私数据。

  - type: input
    id: version
    attributes:
      label: 脚本版本
      placeholder: 例如 V8.2.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 浏览器与 Tampermonkey 版本
      placeholder: 例如 Chrome 版本号、Tampermonkey 版本号
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 请按顺序说明操作和页面筛选条件
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 实际结果与期望结果
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: 诊断信息
      description: 可从右上角齿轮菜单复制；提交前请再次确认其中没有隐私内容。
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认没有提交 Cookie、Token、作品标题或账号隐私。
          required: true
